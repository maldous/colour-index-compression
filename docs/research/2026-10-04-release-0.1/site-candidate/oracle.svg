<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 350"><rect width="540" height="350" rx="14" fill="#10211f"/><g font-family="sans-serif"><text x="28" y="39" fill="#a5c1b8" font-size="12" letter-spacing="2">IDEAL PREDICTIVE LOSS · BITS</text><text x="28" y="85" fill="#e5ede6" font-size="15">Best individual</text><rect x="28" y="99" width="452" height="22" rx="4" fill="#6597a9"/><text x="485" y="89" fill="#e5ede6" font-size="14" text-anchor="end">163,134</text><text x="28" y="158" fill="#e5ede6" font-size="15">Causal fixed-share</text><rect x="28" y="173" width="449" height="22" rx="4" fill="#8bf0d0"/><text x="485" y="163" fill="#8bf0d0" font-size="14" text-anchor="end">162,197</text><text x="28" y="233" fill="#edc389" font-size="15">Hindsight oracle — noncausal</text><rect x="28" y="247" width="321" height="22" rx="4" fill="#ad895a"/><text x="485" y="238" fill="#edc389" font-size="14" text-anchor="end">115,971</text><text x="28" y="312" fill="#a5c1b8" font-size="12">The oracle sees the answer. A real decoder cannot.</text><text x="28" y="332" fill="#a5c1b8" font-size="12">These are diagnostics, not physical archive sizes.</text></g></svg>
