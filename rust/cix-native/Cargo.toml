[package]
name = "cix-native"
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
description = "CIX lossless command-line compressor"
readme = "README.md"
license = "MIT"
autobins = false
# Research microbenchmarks are preserved outside the shipping target set.
# They have independent harness dependencies and are not product build targets.
autobenches = false
autoexamples = false
keywords = ["compression", "lossless", "archive", "cli"]
categories = ["command-line-utilities", "compression"]

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[[bin]]
name = "cix"
path = "src/main.rs"

[[bin]]
name = "uncix"
path = "src/uncix.rs"

[[bin]]
name = "cixcat"
path = "src/cixcat.rs"

[[example]]
name = "native_buffer"
path = "examples/native_buffer.rs"

[dependencies]
sha2 = "0.10"
crc32fast = "1"
flate2 = { version = "1", default-features = false, features = ["zlib"] }
libc = "0.2"
ctrlc = { version = "3", features = ["termination"] }
num-bigint = "0.4"
num-traits = "0.2"

[build-dependencies]
cc = "1"

[profile.release-lto]
inherits = "release"
lto = true
codegen-units = 1
