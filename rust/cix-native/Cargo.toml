[package]
name = "cix-native"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "cix"
path = "src/main.rs"

[[bin]]
name = "uncix"
path = "src/uncix.rs"

[[bin]]
name = "cixcat"
path = "src/cixcat.rs"

[dependencies]
sha2 = "0.10"
crc32fast = "1"
flate2 = { version = "1", default-features = false, features = ["zlib"] }
libc = "0.2"
ctrlc = { version = "3", features = ["termination"] }
num-bigint = "0.4"
num-traits = "0.2"

[profile.release-lto]
inherits = "release"
lto = true
codegen-units = 1
