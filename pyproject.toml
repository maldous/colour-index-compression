[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cix-compression"
version = "0.1.0"
description = "Adaptive streaming multinomial Colour/Index compression research codec"
requires-python = ">=3.11"

[project.optional-dependencies]
fast-bwt = ["pydivsufsort>=0.0.20"]
dev = ["pytest>=8", "pytest-timeout>=2"]
benchmarks = ["brotli>=1", "zstandard>=0.23"]

[project.scripts]
cix = "cix.cli:main_compress"
uncix = "cix.cli:main_decompress"

[tool.pytest.ini_options]
testpaths = ["tests"]
