name: CTW probe
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ctw-probe.yml"
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: python benchmarks/ctw_probe.py
