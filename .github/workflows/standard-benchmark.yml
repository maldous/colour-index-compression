name: Standard compression benchmark

on:
  workflow_dispatch:

jobs:
  canterbury:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy
      - name: Run Canterbury benchmark
        run: python benchmarks/canterbury.py
      - uses: actions/upload-artifact@v4
        with:
          name: canterbury-results
          path: benchmark-results.md
