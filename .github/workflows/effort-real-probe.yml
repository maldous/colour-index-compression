name: CIX effort real-data probe

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/effort-real-probe.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[fast-bwt]' brotli zstandard
      - run: python benchmarks/effort_real_probe.py
