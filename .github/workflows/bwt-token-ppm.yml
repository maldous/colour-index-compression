name: BWT token PPM probe
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bwt-token-ppm.yml"
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[fast-bwt]'
      - run: python benchmarks/bwt_token_ppm.py
