name: PPM history window probe
on:
  push:
    branches: [cix-ppm-history-window]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: python benchmarks/ppm_history_window_probe.py
