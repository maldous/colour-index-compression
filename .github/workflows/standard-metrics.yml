name: Canterbury ratio and timing
on:
  push:
    branches: [main]
    paths:
      - "benchmarks/standard_metrics.py"
      - ".github/workflows/standard-metrics.yml"
  workflow_dispatch:
jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install zpaq
      - run: python benchmarks/standard_metrics.py
      - uses: actions/upload-artifact@v4
        with:
          name: standard-metrics
          path: standard-metrics.md
