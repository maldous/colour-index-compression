name: Universal model tournament

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/model-tournament.yml"

jobs:
  tournament:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[fast-bwt]' brotli zstandard
      - name: Run bounded architecture tournament
        run: python benchmarks/model_tournament.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: model-tournament-results
          path: tournament-results.json
          if-no-files-found: ignore
