name: CIX composition prior probe

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/composition-prior-probe.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python benchmarks/composition_prior_probe.py
