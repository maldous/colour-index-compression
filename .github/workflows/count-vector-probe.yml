name: CIX count-vector physical probe

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/count-vector-probe.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: python benchmarks/count_vector_probe.py
