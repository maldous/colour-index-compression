name: Expert Canterbury benchmark

on:
  workflow_dispatch:

jobs:
  expert:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install brotli pyppmd zstandard
      - name: Run expert portfolio
        run: python benchmarks/expert_portfolio.py
      - uses: actions/upload-artifact@v4
        with:
          name: expert-canterbury-results
          path: expert-results.md
