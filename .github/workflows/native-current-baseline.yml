name: Current native Canterbury baseline

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/native-current-baseline.yml"

jobs:
  canterbury:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[fast-bwt]'
      - name: Physical native Canterbury baseline
        run: python benchmarks/native_current.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-current-results
          path: native-current-results.md
          if-no-files-found: ignore
