name: CIX specialized Canterbury probe
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/specialized-probe.yml"
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        file: [ptt5, sum]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e '.[fast-bwt]'
      - run: python benchmarks/specialized_probe.py "${{ matrix.file }}"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: specialized-${{ matrix.file }}
          path: specialized-*.json
