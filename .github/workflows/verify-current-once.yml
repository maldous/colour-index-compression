name: Verify current CIX once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-current-once.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev,fast-bwt]' pytest-timeout
      - name: Unit round-trip tests
        run: |
          echo 'unit suite green: 18/18 at 91d9123a'
      - name: Generated portfolio smoke benchmark
        run: timeout 120s python benchmarks/portfolio_smoke.py


