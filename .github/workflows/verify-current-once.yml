name: Verify current CIX once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-current-once.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev,fast-bwt]' pytest-timeout
      - name: Full bounded unit round-trip suite
        run: pytest -q --timeout=45 --timeout-method=thread
      - name: Generated portfolio smoke benchmark
        run: python benchmarks/portfolio_smoke.py

