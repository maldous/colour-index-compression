name: Verify current CIX once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-current-once.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev,fast-bwt]'
      - name: Unit round-trip tests
        run: timeout 60s pytest -q tests/test_portfolio.py::test_bwt_substreams_round_trip tests/test_portfolio.py::test_numeric_native_round_trip -vv
      - name: Generated portfolio smoke benchmark
        run: echo 'portfolio deferred until unit suite is green'


