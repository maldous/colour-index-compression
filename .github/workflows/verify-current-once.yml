name: Verify current CIX once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-current-once.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev,fast-bwt]' pytest-timeout
      - name: Unit round-trip tests
        run: |
          timeout 60s pytest -q tests/test_portfolio.py::test_lz_substreams_round_trip_and_exploit_repetition tests/test_portfolio.py::test_lz_uses_previous_stream_history -vv
      - name: Generated portfolio smoke benchmark
        run: echo 'portfolio deferred until LZ verification passes'


