name: PPM wide physical probe
on:
  push:
    branches: [cix-order-wide-fast]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[fast-bwt]' brotli zstandard
      - run: python benchmarks/current_real_probe.py
