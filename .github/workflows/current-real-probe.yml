name: PPM LOE probe
on:
  push:
    branches: [cix-ppm-loe]
    paths:
      - "cix/**"
      - "tests/**"
      - "benchmarks/current_real_probe.py"
      - ".github/workflows/current-real-probe.yml"
      - "pyproject.toml"
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[fast-bwt]' brotli zstandard pytest
      - run: python -m pytest -q tests/test_ppm.py
      - run: python benchmarks/ppm_loe_probe.py
