name: Current universal real probe
on:
  push:
    branches: [main, cix-ppmd-verify]
    paths:
      - "cix/**"
      - "tests/**"
      - "benchmarks/**"
      - ".github/workflows/current-real-probe.yml"
      - "pyproject.toml"
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[fast-bwt]' brotli zstandard pytest
      - run: python -m pytest -q
      - run: python benchmarks/ppm_discount_tournament.py
      - run: python benchmarks/current_real_probe.py
