name: Markov type-class probe
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/markov-type-probe.yml"
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy
      - run: python benchmarks/markov_type_probe.py
